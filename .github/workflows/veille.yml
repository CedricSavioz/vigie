name: Veille (1x / 2 semaines)

on:
  schedule:
    - cron: "30 4 * * 1" # tous les lundis 06h30 en Suisse l'été, 05h30 l'hiver ; un lundi sur deux est ignoré (voir étape "Vérifier la cadence")
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la cadence (1 semaine ISO sur 2)
        id: cadence
        run: |
          # cron ne sait pas exprimer "toutes les 2 semaines" : on tourne chaque
          # lundi et on ne laisse passer qu'une semaine ISO paire sur deux.
          # Un déclenchement manuel (workflow_dispatch) passe toujours.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "executer=true" >> "$GITHUB_OUTPUT"
          else
            SEMAINE=$(date -u +%V)
            if [ $((10#$SEMAINE % 2)) -eq 0 ]; then
              echo "executer=true" >> "$GITHUB_OUTPUT"
            else
              echo "executer=false" >> "$GITHUB_OUTPUT"
              echo "Semaine ISO $SEMAINE impaire : on saute, prochaine veille dans 2 semaines."
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.executer == 'true'
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: steps.cadence.outputs.executer == 'true'
        run: pip install -r requirements.txt

      - name: Collecte des publications
        if: steps.cadence.outputs.executer == 'true'
        run: python run.py fetch

      - name: Analyse IA des publications en attente
        if: steps.cadence.outputs.executer == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Pas de clé ANTHROPIC_API_KEY configurée : analyse sautée, les nouvelles publications resteront en attente."
          else
            python run.py analyze --limit 40
          fi

      - name: Génération du site
        if: steps.cadence.outputs.executer == 'true'
        run: python run.py render

      - name: Commit des données mises à jour
        if: steps.cadence.outputs.executer == 'true'
        run: |
          git config user.name "vigie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json site/index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
          else
            git commit -m "Veille automatique du $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Déploiement Netlify
        if: steps.cadence.outputs.executer == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          SHA=$(sha1sum site/index.html | cut -d' ' -f1)
          DEPLOY=$(curl -sS -X POST "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" \
            -d "{\"files\":{\"/index.html\":\"$SHA\"}}")
          DEPLOY_ID=$(echo "$DEPLOY" | python -c "import sys,json;d=json.load(sys.stdin);print(d['id'] if 'id' in d else sys.exit('Erreur API Netlify : '+json.dumps(d)))")
          REQUIRED=$(echo "$DEPLOY" | python -c "import sys,json;print(len(json.load(sys.stdin).get('required') or []))")
          if [ "$REQUIRED" -gt 0 ]; then
            curl -sS -X PUT "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID/files/index.html" \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @site/index.html > /dev/null
            echo "Déploiement $DEPLOY_ID : index.html envoyé."
          else
            echo "Déploiement $DEPLOY_ID : contenu inchangé, rien à envoyer."
          fi
