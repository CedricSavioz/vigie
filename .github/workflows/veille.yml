name: Veille quotidienne

on:
  schedule:
    - cron: "30 4 * * *" # 06h30 en Suisse l'été, 05h30 l'hiver
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecte des publications
        run: python run.py fetch

      - name: Analyse IA des publications en attente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Pas de clé ANTHROPIC_API_KEY configurée : analyse sautée, les nouvelles publications resteront en attente."
          else
            python run.py analyze --limit 20
          fi

      - name: Génération du site
        run: python run.py render

      - name: Commit des données mises à jour
        run: |
          git config user.name "vigie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json site/index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
          else
            git commit -m "Veille automatique du $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Déploiement Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir site
